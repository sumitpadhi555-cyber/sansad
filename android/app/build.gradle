plugins {
    id 'com.android.application'
    id 'maven-publish'
}

android {
    namespace 'com.sansadshowdown.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sansadshowdown.game'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

def webRoot = rootProject.projectDir.parentFile
def generatedWebAssets = layout.buildDirectory.dir('generated/webAssets')

tasks.register('copyWebAssets', Copy) {
    from(webRoot) {
        include 'index.html', 'game.js', 'style.css', 'vendor/**'
    }
    into(generatedWebAssets.map { it.dir('www') })
}

android.sourceSets.main.assets.srcDir(generatedWebAssets.get().asFile)

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyWebAssets')
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

publishing {
    publications {
        apk(MavenPublication) {
            groupId = 'com.sansadshowdown'
            artifactId = 'sansad-showdown'
            version = android.defaultConfig.versionName
            artifact(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')) {
                extension = 'apk'
                builtBy { tasks.named('assembleDebug').get() }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/sumitpadhi555-cyber/sansad')
            credentials {
                username = providers.gradleProperty('gpr.user')
                    .orElse(providers.environmentVariable('GITHUB_ACTOR'))
                    .getOrElse('')
                password = providers.gradleProperty('gpr.key')
                    .orElse(providers.environmentVariable('GITHUB_TOKEN'))
                    .getOrElse('')
            }
        }
    }
}
